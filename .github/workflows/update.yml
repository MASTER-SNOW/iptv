name: Update playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: cp playlist.m3u old.m3u || touch old.m3u
      - run: python check.py
      - name: Звіт
        run: |
          echo "### Звіт оновлення" >> $GITHUB_STEP_SUMMARY
          echo "Було каналів: $(grep -c '^#EXTINF' old.m3u)" >> $GITHUB_STEP_SUMMARY
          echo "Стало каналів: $(grep -c '^#EXTINF' playlist.m3u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Додано:**" >> $GITHUB_STEP_SUMMARY
          comm -13 <(grep '^#EXTINF' old.m3u | sort) <(grep '^#EXTINF' playlist.m3u | sort) | sed 's/^#EXTINF:-1,/- /' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Видалено:**" >> $GITHUB_STEP_SUMMARY
          comm -23 <(grep '^#EXTINF' old.m3u | sort) <(grep '^#EXTINF' playlist.m3u | sort) | sed 's/^#EXTINF:-1,/- /' >> $GITHUB_STEP_SUMMARY || true
      - run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add playlist.m3u
          git commit -m "update playlist" || exit 0
          git push
